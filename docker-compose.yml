# Production. Pulls ghcr.io/nicolaeser/mcpicloudcalendar:latest.
#
#   docker compose up -d
# Tag override: IMAGE_TAG=dev docker compose up -d
# Local build:  docker compose -f docker-compose.dev.yml up --build

services:
  mcpicloudcalendar:
    image: ${IMAGE:-ghcr.io/nicolaeser/mcpicloudcalendar}:${IMAGE_TAG:-latest}
    container_name: mcpicloudcalendar
    pull_policy: ${PULL_POLICY:-always}
    ports:
      - "8080:8080"
    environment:
      NODE_ENV: "production"
      MCP_HOST: "0.0.0.0"
      MCP_PORT: "8080"
      MCP_OAUTH_SECRET: "${MCP_OAUTH_SECRET:-change-me-oauth-secret-32chars-min}"
      MCP_AUTH_PASSWORD: "${MCP_AUTH_PASSWORD:-change-me}"
      MCP_PUBLIC_URL: "${MCP_PUBLIC_URL:-http://127.0.0.1:8080}"
      MCPICLOUDCALENDAR_PUBLIC_URL: "${MCPICLOUDCALENDAR_PUBLIC_URL:-http://127.0.0.1:8080}"
      MCP_SESSION_STORE: "/var/lib/mcp/sessions.sqlite"
      MAX_SESSIONS: "32"
      ICLOUD_EMAIL: "${ICLOUD_EMAIL:-}"
      ICLOUD_APP_PASSWORD: "${ICLOUD_APP_PASSWORD:-}"
    volumes:
      - ./data:/var/lib/mcp
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 3s
      retries: 8
    restart: unless-stopped
