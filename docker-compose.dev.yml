services:
  mcpicloudcalendar:
    container_name: mcpicloudcalendar
    build:
      context: .
    ports:
      - "8080:8080"
    environment:
      NODE_ENV: "development"
      MCP_OAUTH_SECRET: "change-me-oauth-secret-32chars-min"
      MCP_AUTH_PASSWORD: "change-me"
      MCP_PUBLIC_URL: "http://127.0.0.1:8080"
      MCP_ALLOW_OPEN_CONSENT: "1"
      MAX_SESSIONS: "32"
    volumes:
      - ./data:/var/lib/mcp
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 3s
      retries: 8
    restart: unless-stopped
